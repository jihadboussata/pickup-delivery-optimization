name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible open-source environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Test model and independent checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce and verify all capacity experiments
        run: python -m pickup_delivery --verify --sensitivity 2 3 4 5 6 7 8
      - name: Execute the project notebook
        run: |
          python -m pip install nbformat nbclient ipykernel
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read('notebooks/walkthrough.ipynb', as_version=4)
          NotebookClient(nb, timeout=120, kernel_name='python3').execute()
          print('Notebook executed successfully')
          PY
